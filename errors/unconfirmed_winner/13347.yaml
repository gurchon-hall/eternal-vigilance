  description: I was inspired some years ago by Jonas Ståhle's antiventrue 
    grinder with animalism in which Carrion crows had great synergy with Hidden 
    strength. I was very excited when we got Djeneba and Barachiel with 
    animalism, even though I needed to add a bit of off-clan crypt support and 
    discipline masters. Djeneba's stealth is amazing for both Govern the 
    unaligned superior which rarely gets blocked and a sneaky Deep song to hit 
    the bouncer off the table.
